  <script>
/**
 * 总平面图模块（原生分辨率渲染 · 缩放/平移/拖拽标点）
 *
 * 核心改进：
 *   - canvas 设为图片原始尺寸 9933×7016，放大不模糊（到 A1/300DPI 仍清晰）
 *   - 标点 30px（画布坐标），反向缩放保持可见性：
 *       100% → 1x，50% → 2x，25% → 4x（封顶），更低仍 4x
 *   - zoom=1.0 = 原始分辨率(100%)，zoom=0.085 ≈ 适应窗口
 *
 * 交互：
 *   - 滚轮 / 按钮：缩放底图（以鼠标位置为中心）
 *   - 拖拽底图空白处：平移
 *   - 拖拽标点：移动位置（自动保存到 localStorage）
 *   - 单击标点（未拖动）：跳转房屋详情
 *   - 双击底图：重置到适应窗口
 */
const PLAN_POS_KEY = 'tq_plan_positions_v1';
const PLAN_IMG_W = 9933;
const PLAN_IMG_H = 7016;

const PlanSection = {

  /** 默认坐标（百分比），可被 localStorage 中自定义坐标覆盖 */
  POSITIONS: {
    'H001': { x: 61, y: 9 },  'H002': { x: 65, y: 8 },  'H003': { x: 70, y: 9 },
    'H004': { x: 76, y: 14 }, 'H005': { x: 61, y: 16 }, 'H006': { x: 73, y: 19 },
    'H007': { x: 31, y: 32 }, 'H008': { x: 38, y: 31 }, 'H009': { x: 45, y: 31 },
    'H010': { x: 51, y: 33 }, 'H011': { x: 57, y: 35 }, 'H012': { x: 62, y: 37 },
    'H013': { x: 32, y: 46 }, 'H014': { x: 39, y: 45 }, 'H015': { x: 46, y: 46 },
    'H016': { x: 52, y: 48 }, 'H017': { x: 58, y: 50 }, 'H018': { x: 62, y: 47 },
    'H019': { x: 34, y: 60 }, 'H020': { x: 41, y: 62 }, 'H021': { x: 48, y: 63 },
    'H022': { x: 54, y: 65 }, 'H023': { x: 60, y: 67 }, 'H024': { x: 62, y: 60 },
    'H025': { x: 36, y: 73 }, 'H026': { x: 44, y: 75 }, 'H027': { x: 51, y: 76 },
    'H028': { x: 58, y: 76 }, 'H029': { x: 62, y: 73 },
    'H030': { x: 19, y: 82 }, 'H031': { x: 27, y: 87 }, 'H032': { x: 22, y: 92 },
    'H033': { x: 32, y: 91 },
    'H034': { x: 67, y: 12 }
  },

  /** 缩放/平移状态。zoom=1.0 表示原始分辨率 */
  view: { zoom: 0.085, panX: 0, panY: 0 },

  /** 适应窗口的缩放比例（afterRender 时动态计算） */
  _fitZoom: 0.085,

  /** 用户自定义坐标（从 localStorage 加载） */
  customPositions: {},

  /** 拖拽状态 */
  _drag: null,

  _focusId: null,

  /** 标点锁定状态：true=锁定（不可拖动），false=解锁（可拖动）。默认每次进入都锁定 */
  locked: true,

  /** 初始化：加载自定义坐标 */
  _initDone: false,
  _ensureInit() {
    if (this._initDone) return;
    if (READONLY) {
      // 已发布查看版：仅使用发布时固化的点位（含用户移动过的位置），不使用本机 localStorage，
      // 避免浏览器的 localStorage 漂移；点位随每次🚀发布同步。
      try {
        const pub = (typeof window !== 'undefined' && window.PUBLISHED_DATA && window.PUBLISHED_DATA.planPositions);
        if (pub && typeof pub === 'object') this.customPositions = pub;
      } catch(e) { console.warn('Plan positions load from published error:', e); }
    } else {
      try {
        const saved = localStorage.getItem(PLAN_POS_KEY);
        if (saved) this.customPositions = JSON.parse(saved);
      } catch(e) { console.warn('Plan positions load error:', e); }
    }
    this._initDone = true;
  },

  /** 导出当前"自定义覆盖"点位（仅用户移动过的），供🚀发布时固化进 PUBLISHED_DATA */
  exportPositions() {
    this._ensureInit();
    return this.customPositions || {};
  },

  /** 获取房屋坐标（优先自定义） */
  getPos(houseId) {
    this._ensureInit();
    return this.customPositions[houseId] || this.POSITIONS[houseId] || null;
  },

  /** 保存自定义坐标 */
  _savePositions() {
    try {
      localStorage.setItem(PLAN_POS_KEY, JSON.stringify(this.customPositions));
    } catch(e) { console.warn('Plan positions save error:', e); }
  },

  /** 重置所有自定义坐标 */
  resetPositions() {
    if (!Utils.confirm('确定要重置所有标点位置为默认值吗？')) return;
    this.customPositions = {};
    this._savePositions();
    Utils.toast('标点位置已重置', 'success');
    Router.render();
  },

  /**
   * 总平图标点类型（用于区分颜色）：
   *   - in_use（已使用，红色）：有当前经营户，或已落户 / 已出租 / 自用
   *   - negotiating（洽谈中，橙色）：招商情况为"洽谈中"
   *   - recruiting（招商中，绿色）：其余（默认）
   */
  _planType(h) {
    const tenant = Biz.getCurrentTenant(h.house_id);
    if (tenant ||
        (h.recruit_status || '') === '已落户' ||
        h.leasing_status === '已出租' ||
        h.leasing_status === '自用') {
      return 'in_use';
    }
    if ((h.recruit_status || '') === '洽谈中') return 'negotiating';
    return 'recruiting';
  },

  /**
   * 渲染总平面图模块
   */
  render(focusHouseId = null) {
    this._ensureInit();
    this.locked = true; // 默认进入即锁定，退出自动锁定
    const houses = DB.getHouses();
    const isHighlight = (h) => !focusHouseId || h.house_id === focusHouseId;
    const z = this.view.zoom;
    const px = this.view.panX;
    const py = this.view.panY;

    return `
      <div class="plan-section">
        <div class="plan-header">
          <div>
            <div class="plan-title">总平面图</div>
            <div class="plan-sub">滚轮缩放底图 · Shift+滚轮滚动页面 · 拖拽底图平移 · 单击标点进入详情</div>
          </div>
          <div class="plan-toolbar">
            <div class="plan-legend">
              <span class="legend-item"><span class="dot dot-in-use"></span>已使用</span>
              <span class="legend-item"><span class="dot dot-recruiting"></span>招商中</span>
              <span class="legend-item"><span class="dot dot-negotiating"></span>洽谈中</span>
            </div>
            <div class="plan-zoom-ctrl">
              <button class="zoom-btn" title="缩小" onclick="PlanSection.zoomBy(0.8)">−</button>
              <span class="zoom-level" id="plan-zoom-level">${Math.round(z * 100)}%</span>
              <button class="zoom-btn" title="放大" onclick="PlanSection.zoomBy(1.25)">+</button>
              <button class="zoom-btn" title="适应窗口" onclick="PlanSection.resetView()">⟲</button>
              <button class="zoom-btn" title="重置标点位置" onclick="PlanSection.resetPositions()">⤺</button>
              <button class="zoom-btn lock-btn ${this.locked ? 'locked' : 'unlocked'}" id="plan-lock-btn" title="${this.locked ? '标点已锁定：点击解锁后可拖动' : '标点已解锁：点击锁定'}" onclick="PlanSection.toggleLock()">${this.locked ? '🔒' : '🔓'}</button>
            </div>
            ${focusHouseId ? `<button class="btn btn-sm" onclick="PlanSection.clearFocus()">取消高亮</button>` : ''}
          </div>
        </div>
        <div class="plan-frame">
        <div class="plan-viewport" id="plan-viewport">
          <div class="plan-canvas ${this.locked ? 'locked' : ''}" id="plan-canvas"
               style="width:${PLAN_IMG_W}px;height:${PLAN_IMG_H}px;transform:translate(${px}px,${py}px) scale(${z});transform-origin:0 0;">
            <img src="images/招商平面图0702.png" alt="田墘社区招商总平面图" class="plan-image" draggable="false">
            <div class="plan-hotspots">
              ${houses.map(h => {
                const pos = this.getPos(h.house_id);
                if (!pos) return '';
                const typeKey = this._planType(h);
                const typeLabel = { in_use: '已使用', recruiting: '招商中', negotiating: '洽谈中' }[typeKey] || '招商中';
                const dim = focusHouseId && !isHighlight(h) ? 'dim' : '';
                const focused = focusHouseId === h.house_id ? 'focused' : '';
                const custom = this.customPositions[h.house_id] ? 'custom' : '';
                return `
                  <button class="hotspot ${typeKey} ${dim} ${focused} ${custom}"
                          style="left:${pos.x}%; top:${pos.y}%"
                          data-house-id="${h.house_id}"
                          data-door="${Utils.esc(h.door_number)}"
                          aria-label="${Utils.esc(h.door_number)} · ${typeLabel}${h.measured_area ? ' · ' + h.measured_area.toFixed(0) + '㎡' : ''}">
                    <span class="hotspot-pulse"></span>
                    <span class="hotspot-label">${Utils.esc(this.shortDoor(h.door_number))}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
          <div class="plan-tooltip" id="plan-tooltip" style="display:none;"></div>
        </div>
        </div>
      </div>
    `;
  },

  /** 渲染后绑定事件 */
  afterRender() {
    const viewport = document.getElementById('plan-viewport');
    if (!viewport) return;

    // 计算适应窗口的缩放比例
    const rect = viewport.getBoundingClientRect();
    this._fitZoom = Math.min(rect.width / PLAN_IMG_W, rect.height / PLAN_IMG_H);

    // 每次进入都自动适应窗口（显示完整画面）；当前视图内可自由缩放/平移
    this.view = { zoom: this._fitZoom, panX: 0, panY: 0 };
    this._applyTransform();

    // 锁定状态同步到画布（控制光标样式）
    const canvasEl = document.getElementById('plan-canvas');
    if (canvasEl) canvasEl.classList.toggle('locked', this.locked);

    // 悬停信息卡：光标移到标点显示图片/面积/地址/格局
    viewport.querySelectorAll('.hotspot').forEach((hs) => {
      hs.addEventListener('mouseenter', () => PlanSection._showTooltip(hs.dataset.houseId, hs));
      hs.addEventListener('mouseleave', () => PlanSection._hideTooltip());
    });
    viewport.addEventListener('mouseleave', () => PlanSection._hideTooltip());

    // ---- 滚轮缩放 ----
    viewport.addEventListener('wheel', (e) => {
      // 滚轮缩放底图（含触屏双指 pinch）；Shift+滚轮或光标移到左右锁边区时，让位给页面滚动
      if (e.shiftKey) return;
      e.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      this._zoomAt(mx, my, factor);
    }, { passive: false });

    // ---- 双击重置 ----
    viewport.addEventListener('dblclick', (e) => {
      e.preventDefault();
      this.resetView();
    });

    // ---- 平移 / 标点拖拽 ----
    viewport.addEventListener('mousedown', (e) => {
      const hotspot = e.target.closest('.hotspot');
      if (hotspot) {
        // 标点：锁定状态下仅响应点击（跳转），解锁后才可拖动
        this._drag = {
          type: 'marker',
          el: hotspot,
          houseId: hotspot.dataset.houseId,
          startX: e.clientX,
          startY: e.clientY,
          moved: false
        };
        this._hideTooltip();
        if (!this.locked) hotspot.classList.add('dragging');
        e.preventDefault();
      } else {
        // 平移
        this._drag = {
          type: 'pan',
          startX: e.clientX,
          startY: e.clientY,
          panX: this.view.panX,
          panY: this.view.panY
        };
        viewport.style.cursor = 'grabbing';
      }
    });

    // 用 document 级监听，确保拖出 viewport 也能响应
    document.addEventListener('mousemove', this._onMouseMove);
    document.addEventListener('mouseup', this._onMouseUp);
  },

  /** mousemove handler（绑定到 document） */
  _onMouseMove(e) {
    const d = PlanSection._drag;
    if (!d) return;

    if (d.type === 'pan') {
      const dx = e.clientX - d.startX;
      const dy = e.clientY - d.startY;
      PlanSection.view.panX = d.panX + dx;
      PlanSection.view.panY = d.panY + dy;
      PlanSection._applyTransform();
    } else if (d.type === 'marker') {
      if (PlanSection.locked) return; // 锁定状态不移动标点
      const dx = e.clientX - d.startX;
      const dy = e.clientY - d.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) d.moved = true;

      if (d.moved) {
        // 计算标点在 canvas 中的新百分比位置
        const canvas = document.getElementById('plan-canvas');
        const cRect = canvas.getBoundingClientRect();
        // cRect 已经是缩放后的实际尺寸
        const pctX = ((e.clientX - cRect.left) / cRect.width) * 100;
        const pctY = ((e.clientY - cRect.top) / cRect.height) * 100;
        const clampedX = Math.max(0, Math.min(100, pctX));
        const clampedY = Math.max(0, Math.min(100, pctY));
        d.el.style.left = clampedX + '%';
        d.el.style.top = clampedY + '%';
        d.newX = clampedX;
        d.newY = clampedY;
      }
    }
  },

  /** mouseup handler（绑定到 document） */
  _onMouseUp(e) {
    const d = PlanSection._drag;
    if (!d) return;

    if (d.type === 'pan') {
      const viewport = document.getElementById('plan-viewport');
      if (viewport) viewport.style.cursor = '';
    } else if (d.type === 'marker') {
      d.el.classList.remove('dragging');
      if (d.moved) {
        // 保存新位置
        PlanSection.customPositions[d.houseId] = { x: d.newX, y: d.newY };
        PlanSection._savePositions();
        d.el.classList.add('custom');
      } else {
        // 未拖动 → 点击跳转
        PlanSection.goToHouse(d.houseId);
      }
    }
    PlanSection._drag = null;
  },

  /** 应用 transform 到 canvas，并根据缩放级别切换标签/脉冲可见性 */
  _applyTransform() {
    this._clampPan(); // 统一约束平移边界，防止底图被拖出视野
    const canvas = document.getElementById('plan-canvas');
    if (canvas) {
      canvas.style.transform = `translate(${this.view.panX}px, ${this.view.panY}px) scale(${this.view.zoom})`;

      // 标点反向缩放：zoom 越小标点越大，保持可见性
      // 100% → 1x（不变），50% → 2x，25% → 4x（封顶），更低 → 仍 4x
      const ms = Math.min(4, Math.max(1, 1 / this.view.zoom));
      canvas.style.setProperty('--marker-scale', ms);

      // 低缩放时隐藏标签（标点虽放大但标签会互相重叠）
      if (this.view.zoom < 0.35) {
        canvas.classList.add('hide-labels');
      } else {
        canvas.classList.remove('hide-labels');
      }
      // 极低缩放时隐藏脉冲动画（性能优化）
      if (this.view.zoom < 0.15) {
        canvas.classList.add('hide-pulse');
      } else {
        canvas.classList.remove('hide-pulse');
      }
    }
    const level = document.getElementById('plan-zoom-level');
    if (level) level.textContent = Math.round(this.view.zoom * 100) + '%';
  },

  /**
   * 约束平移边界（cover 模式）：
   *   - 底图比视口大时，保证底图始终覆盖视口（不能露出空白、也不能被拖出画面）
   *   - 底图比视口小时，自动居中
   * 这样既能自由缩放查看，又不会"过于随意"地把图拖飞。
   */
  _clampPan() {
    const vp = document.getElementById('plan-viewport');
    if (!vp) return;
    const rect = vp.getBoundingClientRect();
    const vpW = rect.width, vpH = rect.height;
    const z = this.view.zoom;
    const scaledW = PLAN_IMG_W * z;
    const scaledH = PLAN_IMG_H * z;

    if (scaledW <= vpW) {
      this.view.panX = (vpW - scaledW) / 2;
    } else {
      // panX ∈ [vpW - scaledW, 0]
      this.view.panX = Math.min(0, Math.max(vpW - scaledW, this.view.panX));
    }
    if (scaledH <= vpH) {
      this.view.panY = (vpH - scaledH) / 2;
    } else {
      // panY ∈ [vpH - scaledH, 0]
      this.view.panY = Math.min(0, Math.max(vpH - scaledH, this.view.panY));
    }
  },

  /**
   * 将指定房屋标点居中到视口中央（确保想查看的区域位于画面中央）。
   * 自适应计算缩放级别：取"当前缩放 / 适应缩放 / 能将该点居中所需最小缩放"三者最大，
   * 上限 2 倍原始分辨率。靠边点位会自动放大到足以居中的级别（超出上限则钉在边界）。
   */
  centerOn(houseId) {
    const pos = this.getPos(houseId);
    const vp = document.getElementById('plan-viewport');
    if (!pos || !vp) return;
    const rect = vp.getBoundingClientRect();
    const vpW = rect.width, vpH = rect.height;

    const fx = pos.x / 100, fy = pos.y / 100;
    // 将某比例点居中所需的最小缩放：zoom ≥ vpDim / (ImgDim · (1 - 2·|f-0.5|))
    const needX = (fx > 0 && fx < 1) ? vpW / (PLAN_IMG_W * (1 - 2 * Math.abs(fx - 0.5))) : 0;
    const needY = (fy > 0 && fy < 1) ? vpH / (PLAN_IMG_H * (1 - 2 * Math.abs(fy - 0.5))) : 0;

    let z = Math.max(this.view.zoom, this._fitZoom, needX, needY);
    z = Math.min(2.0, z);
    this.view.zoom = z;
    // 目标点在缩放后画布坐标系中的位置
    const cx = (pos.x / 100) * PLAN_IMG_W * z;
    const cy = (pos.y / 100) * PLAN_IMG_H * z;
    // 让其落在视口中心
    this.view.panX = vpW / 2 - cx;
    this.view.panY = vpH / 2 - cy;
    this._clampPan();
    this._applyTransform();
  },

  /** 以指定点为中心缩放 */
  _zoomAt(mx, my, factor) {
    const oldZoom = this.view.zoom;
    let newZoom = oldZoom * factor;
    // 最小 = 适应窗口的 0.5 倍，最大 = 2 倍原始分辨率（A1/300DPI 的 2 倍）
    newZoom = Math.max(this._fitZoom * 0.5, Math.min(2.0, newZoom));
    if (newZoom === oldZoom) return;

    // 保持鼠标位置在 canvas 中的相对位置不变
    this.view.panX = mx - (mx - this.view.panX) * (newZoom / oldZoom);
    this.view.panY = my - (my - this.view.panY) * (newZoom / oldZoom);
    this.view.zoom = newZoom;
    this._applyTransform();
  },

  /** 按钮缩放（以 viewport 中心为基准） */
  zoomBy(factor) {
    const viewport = document.getElementById('plan-viewport');
    if (!viewport) return;
    const rect = viewport.getBoundingClientRect();
    this._zoomAt(rect.width / 2, rect.height / 2, factor);
  },

  /** 重置到适应窗口 */
  resetView() {
    this.view = { zoom: this._fitZoom, panX: 0, panY: 0 };
    this._applyTransform();
  },

  /** 切换标点锁定状态（默认锁定；解锁后可拖动） */
  toggleLock() {
    this.locked = !this.locked;
    const btn = document.getElementById('plan-lock-btn');
    if (btn) {
      btn.textContent = this.locked ? '🔒' : '🔓';
      btn.classList.toggle('locked', this.locked);
      btn.classList.toggle('unlocked', !this.locked);
      btn.title = this.locked ? '标点已锁定：点击解锁后可拖动' : '标点已解锁：点击锁定';
    }
    const cv = document.getElementById('plan-canvas');
    if (cv) cv.classList.toggle('locked', this.locked);
    if (Utils && Utils.toast) Utils.toast(this.locked ? '标点已锁定，不可移动' : '标点已解锁，可拖动点位', 'info');
    if (this.locked) this._hideTooltip();
  },

  /** 显示悬停信息卡（图片 / 商户名称 / 面积 / 地址 / 格局） */
  _showTooltip(houseId, el) {
    const h = DB.getHouse(houseId);
    const tip = document.getElementById('plan-tooltip');
    if (!h || !tip) return;
    const areaRaw = (h.measured_area != null && h.measured_area !== '') ? Number(h.measured_area).toFixed(2) + ' ㎡' : '';
    const layoutRaw = h.layout ? String(h.layout) : '';
    // 商户名称：优先手动名，其次招商合同经营户
    const merchant = (typeof Biz !== 'undefined' && Biz.getTenantName) ? Biz.getTenantName(houseId) : '';
    const merchantBlock = merchant
      ? '<div class="tip-merchant"><div class="tip-merchant-title">入驻商户</div><div class="tip-merchant-name">' + Utils.esc(merchant) + '</div></div>'
      : '';
    const cell = v => v ? Utils.esc(v) : '';
    tip.innerHTML =
      '<div class="tip-img"><img src="' + Utils.esc(h.image_url || '') + '" alt="房屋实景" onerror="this.style.display=\'none\'"></div>' +
      '<div class="tip-body">' +
        '<div class="tip-door">' + Utils.esc(h.door_number) + '</div>' +
        merchantBlock +
        '<div class="tip-row"><span>房屋面积</span><b>' + cell(areaRaw) + '</b></div>' +
        '<div class="tip-row"><span>房屋地址</span><b>' + Utils.esc(h.door_number) + '</b></div>' +
        '<div class="tip-row"><span>房屋格局</span><b>' + cell(layoutRaw) + '</b></div>' +
      '</div>';
    tip.style.display = 'block';
    this._positionTooltip(el);
  },

  /** 定位信息卡（避免溢出视口边界） */
  _positionTooltip(el) {
    const tip = document.getElementById('plan-tooltip');
    const vp = document.getElementById('plan-viewport');
    if (!tip || !vp) return;
    const vpRect = vp.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const ttRect = tip.getBoundingClientRect();
    let left = (r.right - vpRect.left) + 14;
    let top = (r.top - vpRect.top) + r.height / 2 - ttRect.height / 2;
    if (left + ttRect.width > vpRect.width - 6) {
      left = (r.left - vpRect.left) - ttRect.width - 14;
    }
    if (left < 6) left = 6;
    if (top < 6) top = 6;
    if (top + ttRect.height > vpRect.height - 6) top = vpRect.height - ttRect.height - 6;
    if (top < 6) top = 6;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  },

  /** 隐藏悬停信息卡 */
  _hideTooltip() {
    const tip = document.getElementById('plan-tooltip');
    if (tip) tip.style.display = 'none';
  },

  /**
   * 房屋区位图：基于总平面图渲染，仅显示本房屋标点（其他消除），并自动居中放大。
   * 用于详情页"房屋区位图"板块。复用全局 id（plan-viewport / plan-canvas），
   * 因详情页与总览页为路由隔离，不会同时出现。
   */
  renderLocality(houseId) {
    this._ensureInit();
    const h = DB.getHouseById(houseId);
    if (!h) return '';
    const pos = this.getPos(houseId);
    const typeKey = this._planType(h);
    const door = Utils.esc(h.door_number);
    const label = Utils.esc(this.shortDoor(h.door_number));
    return `
      <div class="plan-section plan-locality">
        <div class="plan-header">
          <div>
            <div class="plan-title">房屋区位图</div>
            <div class="plan-sub">基于总平面图放大显示，仅标注本房屋位置 · 滚轮缩放 · 拖拽平移 · 双击恢复初始位置 · 锁边区滚动页面</div>
          </div>
        </div>
        <div class="plan-frame">
        <div class="plan-viewport" id="plan-viewport">
          <div class="plan-canvas" id="plan-canvas"
               style="width:${PLAN_IMG_W}px;height:${PLAN_IMG_H}px;transform:translate(0,0) scale(${this._fitZoom});transform-origin:0 0;">
            <img src="images/招商平面图0702.png" alt="田墘社区招商总平面图" class="plan-image" draggable="false">
            <div class="plan-hotspots">
              ${pos ? `<button class="hotspot ${typeKey}" style="left:${pos.x}%;top:${pos.y}%;" data-house-id="${houseId}" aria-label="${door}"><span class="hotspot-label">${label}</span></button>` : ''}
            </div>
          </div>
        </div>
        </div>
      </div>
    `;
  },

  /** 区位图挂载：计算适应比例，居中放大到本房屋，仅绑定滚轮缩放 / 双击重置（不绑定标点拖拽） */
  afterRenderLocality(houseId) {
    const viewport = document.getElementById('plan-viewport');
    if (!viewport) return;
    const rect = viewport.getBoundingClientRect();
    this._fitZoom = Math.min(rect.width / PLAN_IMG_W, rect.height / PLAN_IMG_H);

    const canvasEl = document.getElementById('plan-canvas');
    if (canvasEl) canvasEl.classList.add('locked');

    const pos = this.getPos(houseId);
    if (pos) {
      const vpW = rect.width, vpH = rect.height;
      const fx = pos.x / 100, fy = pos.y / 100;
      const needX = (fx > 0 && fx < 1) ? vpW / (PLAN_IMG_W * (1 - 2 * Math.abs(fx - 0.5))) : 0;
      const needY = (fy > 0 && fy < 1) ? vpH / (PLAN_IMG_H * (1 - 2 * Math.abs(fy - 0.5))) : 0;
      let z = Math.max(this._fitZoom, needX, needY, 0.5);
      z = Math.min(2.0, z);
      this.view.zoom = z;
      const cx = (pos.x / 100) * PLAN_IMG_W * z;
      const cy = (pos.y / 100) * PLAN_IMG_H * z;
      this.view.panX = vpW / 2 - cx;
      this.view.panY = vpH / 2 - cy;
    } else {
      this.view = { zoom: this._fitZoom, panX: 0, panY: 0 };
    }
    this._clampPan();
    this._applyTransform();

    // 记录初始视图（已居中本房屋），双击时恢复至此
    this._localityInitial = { zoom: this.view.zoom, panX: this.view.panX, panY: this.view.panY };

    // 滚轮缩放（含触屏双指 pinch）；Shift+滚轮或光标移到左右锁边区时让位给页面滚动
    viewport.addEventListener('wheel', (e) => {
      if (e.shiftKey) return;
      e.preventDefault();
      const r = viewport.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      this._zoomAt(mx, my, factor);
    }, { passive: false });

    // 拖拽平移（有限位：由 _clampPan 约束，不会把底图拖出画面）
    viewport.addEventListener('mousedown', (e) => {
      this._drag = {
        type: 'pan',
        startX: e.clientX,
        startY: e.clientY,
        panX: this.view.panX,
        panY: this.view.panY
      };
      viewport.style.cursor = 'grabbing';
      e.preventDefault();
    });

    // 双击恢复初始（居中本房屋）状态
    viewport.addEventListener('dblclick', (e) => {
      e.preventDefault();
      if (this._localityInitial) {
        this.view = { zoom: this._localityInitial.zoom, panX: this._localityInitial.panX, panY: this._localityInitial.panY };
        this._applyTransform();
      }
    });

    // 复用全局平移的 mousemove/mouseup（绑定到 document，拖出视口也能继续响应）
    document.addEventListener('mousemove', this._onMouseMove);
    document.addEventListener('mouseup', this._onMouseUp);
  },

  /**
   * 提取门牌号简称
   */
  shortDoor(door) {
    return (door || '')
      .replace(/^田墘/, '')
      .replace(/号$/, '');
  },

  /**
   * 点击热点 → 跳转详情页
   */
  goToHouse(houseId) {
    this.locked = true; // 退出房屋定位时自动恢复锁定
    Router.navigate('detail', houseId);
  },

  /**
   * 清除高亮
   */
  clearFocus() {
    this._focusId = null;
    Router.render();
  },

  /**
   * 从列表行聚焦平面图
   */
  focusHouse(houseId) {
    this._focusId = houseId;
    Router.render();
    setTimeout(() => {
      const el = document.querySelector('.plan-section');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // 将目标房屋居中到画面中央
      PlanSection.centerOn(houseId);
    }, 50);
  }
};

</script>
  <script>
/**

 */

const Drawers = {
  currentHouseId: null,
  editQueue: [],

  open(title, bodyHtml, footerHtml) {

    document.getElementById('drawer-body').innerHTML = bodyHtml;

    document.getElementById('drawer').classList.add('show');

  close() {
    document.getElementById('drawer-overlay').classList.remove('show');

    this.currentHouseId = null;
    this.editQueue = [];

  /**

  openQuickEdit(houseId) {

    this.currentHouseId = houseId;

    // 构建可编辑列表的所有房屋（用于"保存并编辑下一条"）
    const allHouses = ListPage.getFilteredHouses();
    this.editQueue = allHouses.map(h => h.house_id);

    this.renderQuickEditForm(house);

  renderQuickEditForm(house) {

    const tenant = Biz.getCurrentTenant(house.house_id);
    const masterPay = Biz.getCurrentMasterPaymentStatus(house.house_id);
    const subPay = Biz.getCurrentSubPaymentStatus(house.house_id);

    this.open(`快速编辑 - ${house.door_number}`, `
      <div class="form-group">
        <label>门牌号</label>
        <input type="text" value="${Utils.esc(house.door_number)}" disabled style="background:#f5f5f5;">
      </div>
      <div class="form-group">
        <label>招商状态</label>
        <select id="qe-leasing_status">
          ${LEASING_STATUS.map(s => `<option value="${s}" ${house.leasing_status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>

        <input type="text" id="qe-manual_tenant" value="${Utils.esc(Biz.getTenantName(house.house_id))}" placeholder="留空则沿用招商合同中的经营户">

          <option value="">—</option>

        </select>
      </div>

          <input type="text" id="qe-electric_meter" value="${Utils.esc(house.electric_meter || '')}">
        </div>
      </div>
    `, `
      <button class="btn" onclick="Drawers.close()">取消</button>
      <button class="btn btn-primary readonly-hide" onclick="Drawers.saveQuickEdit(false)">保存</button>
      <button class="btn btn-success readonly-hide" onclick="Drawers.saveQuickEdit(true)">保存并编辑下一条</button>
    `);
  },

  saveQuickEdit(goNext) {
    const houseId = this.currentHouseId;
    if (!houseId) return;
    const house = DB.getHouseById(houseId);
    if (!house) return;

    // 收集房屋字段更新
    const houseUpdates = {};
    const leasingStatus = document.getElementById('qe-leasing_status').value;
    if (leasingStatus !== house.leasing_status) houseUpdates.leasing_status = leasingStatus;
    const measuredArea = parseFloat(document.getElementById('qe-measured_area').value);
    if (!isNaN(measuredArea) && measuredArea !== house.measured_area) houseUpdates.measured_area = measuredArea;
    const recruitStatus = document.getElementById('qe-recruit_status').value;
    if (recruitStatus && recruitStatus !== (house.recruit_status || '')) houseUpdates.recruit_status = recruitStatus;
    const repairCycle = document.getElementById('qe-repair_cycle').value;
    if (repairCycle && repairCycle !== (house.repair_cycle || '')) houseUpdates.repair_cycle = repairCycle;
    const currentStatus = document.getElementById('qe-current_status').value;
    if (currentStatus !== (house.current_status || '')) houseUpdates.current_status = currentStatus;
    const manualTenant = (document.getElementById('qe-manual_tenant').value || '').trim();
    if (manualTenant !== Biz.getTenantName(houseId)) {
      // 名称有变动（含清空为 '' 表示恢复沿用招商合同）
      houseUpdates.manual_tenant_name = manualTenant;
    }
    const waterMeter = document.getElementById('qe-water_meter').value;
    if (waterMeter !== (house.water_meter || '')) houseUpdates.water_meter = waterMeter;
    const electricMeter = document.getElementById('qe-electric_meter').value;
    if (electricMeter !== (house.electric_meter || '')) houseUpdates.electric_meter = electricMeter;

    if (Object.keys(houseUpdates).length > 0) {
      DB.updateHouse(houseId, houseUpdates, '快速编辑');
    }

    // 更新我方支付状态（通过收储合同）
    const masterPay = document.getElementById('qe-payment_status_master').value;
    if (masterPay) {
      const mc = DB.getMasterContractsByHouse(houseId)[0];
      if (mc && mc.payment_status_master !== masterPay) {
        DB.updateMasterContract(mc.contract_id, { payment_status_master: masterPay }, '快速编辑');
      }
    }

    // 更新租户支付状态（通过转租合同）
    const subPay = document.getElementById('qe-payment_status_sub').value;
    if (subPay) {
      const tenant = Biz.getCurrentTenant(houseId);
      if (tenant && tenant.payment_status_sub !== subPay) {
        DB.updateSubContract(tenant.sub_id, { payment_status_sub: subPay }, '快速编辑');
      }
    }

    Utils.toast('保存成功', 'success');

    if (goNext) {
      // 找到下一条
      const currentIdx = this.editQueue.indexOf(houseId);
      const nextIdx = currentIdx + 1;
      if (nextIdx < this.editQueue.length) {
        const nextHouse = DB.getHouseById(this.editQueue[nextIdx]);
        this.renderQuickEditForm(nextHouse);
        Router.render();

        Utils.toast('已是最后一条', 'info');
        this.close();
        Router.render();
      }
    } else {
      this.close();
      Router.render();
    }
  }
};

const Modals = {
  open(title, bodyHtml, footerHtml) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-footer').innerHTML = footerHtml || `
      <button class="btn btn-primary" onclick="Modals.close()">关闭</button>
    `;
    document.getElementById('modal-overlay').classList.add('show');
  },

  close() {
    document.getElementById('modal-overlay').classList.remove('show');
  }
};

</script>
  <script>
/**
 * 房屋详情页
 * 三大板块布局：
 *   板块一 房屋信息（区位图 + 基础情况 + 现状照片/平面图/收储合同/设备/变更日志 按下显示）
 *   板块二 当前招商商户信息（商户名称 + 合同/改造图纸/改造照片 按下显示）
 *   板块三 资产管理（顶部独立按钮跳转，本期未开发）
 */

const DetailPage = {
  activeTab: 'operation',
  currentHouseId: null,

  render(houseId) {
    this.currentHouseId = houseId;
    const house = DB.getHouseById(houseId);
    if (!house) {
      return '<div class="empty-state"><div class="icon">❌</div><div class="text">房屋不存在</div></div>';
    }

    const mc = DB.getMasterContractsByHouse(houseId)[0];
    const contractArea = (mc && mc.contract_area) ? mc.contract_area : house.measured_area;
    const tenantName = Biz.getTenantName(houseId);
    const isSettled = (house.recruit_status || '') === '已落户';
    const isDanger = !!house.is_dangerous;

    const _order = DB.getHouses() || [];
    const _idx = _order.findIndex(h => h.house_id === houseId);
    const prevHouse = _order.length ? _order[(_idx - 1 + _order.length) % _order.length] : null;
    const nextHouse = _order.length ? _order[(_idx + 1) % _order.length] : null;

    return `
      <!-- 面包屑 -->
      <div class="breadcrumb">
        <a onclick="Router.navigate('list')">资产总览</a>
        <span class="separator">/</span>
        <span class="current">${Utils.esc(house.door_number)}</span>
      </div>

      <!-- 顶部操作栏：板块三（资产管理）作为独立按钮置于上方 -->
      <div class="detail-toolbar">
        <button class="btn btn-sm asset-mgmt-btn" onclick="DetailPage.goAssetMgmt()">🏢 资产管理</button>
        <div class="detail-toolbar-right">
          <button class="btn btn-sm readonly-hide ${isSettled ? 'btn-success' : ''}" onclick="DetailPage.markSettled()">${isSettled ? '✓ 已落户' : '快速标记已落户'}</button>
          <button class="btn btn-sm readonly-hide ${isDanger ? 'btn-danger' : ''}" onclick="DetailPage.toggleDanger()">⚠ 危房提醒${isDanger ? '（已开启）' : ''}</button>
          <button class="btn btn-sm btn-icon" title="上一栋房屋" onclick="Router.navigate('detail','${prevHouse ? prevHouse.house_id : ''}')">◀</button>
          <button class="btn btn-sm btn-icon" title="下一栋房屋" onclick="Router.navigate('detail','${nextHouse ? nextHouse.house_id : ''}')">▶</button>
          <button class="btn btn-sm btn-primary readonly-hide" onclick="DetailPage.editHouseInfo()">编辑房屋信息</button>
        </div>
      </div>

      <!-- ============ 板块一：房屋信息 ============ -->
      <div class="detail-section">
        <div class="detail-section-head">
          <h2 class="detail-section-title">房屋信息</h2>
          <div class="detail-section-tags">
            ${Utils.statusTag(house.leasing_status, STATUS_COLORS)}
            ${mc && mc.grade ? `<span class="tag tag-purple">定级 ${mc.grade}</span>` : ''}
          </div>
        </div>

        <!-- 紧凑档案：图片 + 关键字段并排 -->
        <div class="house-profile">
          <div class="house-profile-img">
            ${house.image_url
              ? `<img src="${house.image_url}" class="info-img" alt="房屋实景" onclick="Viewer.openImages(['${Utils.esc(house.image_url)}'],0)" title="点击放大" onerror="this.style.display='none'">`
              : '<div class="info-img info-img-ph">🏠</div>'}
            <button class="profile-img-upload readonly-hide" onclick="DetailPage.addMedia('image_url', false, 'image/*')">${house.image_url ? '更换照片' : '上传照片'}</button>
          </div>
          <div class="house-profile-info">
            <div class="kv"><span class="kv-k">门牌号</span><span class="kv-v">${Utils.esc(house.door_number)}</span></div>
            <div class="kv"><span class="kv-k">规划区域</span><span class="kv-v">${Utils.esc(house.planning_area) || '—'}</span></div>
            <div class="kv"><span class="kv-k">合同面积</span><span class="kv-v">${Utils.formatArea(contractArea)}</span></div>
            <div class="kv"><span class="kv-k">层数</span><span class="kv-v">${Utils.esc(house.floors) || '—'}</span></div>
            <div class="kv"><span class="kv-k">格局</span><span class="kv-v">${Utils.esc(house.layout) || '—'}</span></div>
            <div class="kv kv-recruit">
              <span class="kv-k">招商情况</span>
              <span class="kv-v">
                <select class="inline-recruit-select readonly-hide" onchange="DetailPage.saveRecruitStatus(this.value)" title="修改后总览同步更新">
                  ${RECRUIT_STATUS.map(s => `<option value="${s}" ${(house.recruit_status || '') === s ? 'selected' : ''}>${s}</option>`).join('')}
                </select>
              </span>
            </div>
          </div>
        </div>
        <!-- 房屋区位图（基于总平图，仅标注本房屋，置于信息之后） -->
        ${PlanSection.renderLocality(houseId)}

        <!-- 房屋现状：原在信息档案下，现移至区位图之后 -->
        <div class="house-profile-status">
          <span class="kv-k">房屋现状</span><span class="kv-v">${Utils.esc(house.current_status) || '—'}</span>
        </div>

        <!-- 按下显示（合同/租金/水电标号等敏感信息已移至"资产管理"） -->
        <div class="disclosure-list">
          ${this._disclosure('房屋现状照片', this._photoGrid(house.current_status_photos, 'current_status_photos'), true)}
          ${this._disclosure('房屋现状平面图', this._planBlock(house.current_status_plan, 'current_status_plan'), true)}
          ${this._disclosure('变更日志', this.renderLogTab(houseId), false)}
        </div>
      </div>

      <!-- ============ 板块二：当前招商商户信息 ============ -->
      <div class="detail-section">
        <div class="detail-section-head">
          <h2 class="detail-section-title">当前招商商户信息</h2>
        </div>

        <div class="merchant-block">
          <div class="merchant-name-label">商户名称</div>
          <div class="merchant-name-value">${tenantName ? Utils.esc(tenantName) : '<span class="muted">（暂无入驻商户）</span>'}</div>
        </div>

        <div class="disclosure-list">
          ${this._disclosure('改造图纸', this._photoGrid(house.renovation_drawings, 'renovation_drawings'), true)}
          ${this._disclosure('改造照片', this._photoGrid(house.renovation_photos, 'renovation_photos'), true)}
        </div>
      </div>

      <!-- ============ 右侧悬浮房屋导航栏（标签常驻右缘，悬浮展开） ============ -->
      ${this._renderRail(houseId)}
    `;
  },

  // ========== 右侧悬浮导航栏（仅保留房屋列表，上下栋切换移至顶部工具栏） ==========
  _renderRail(houseId) {
    const houses = DB.getHouses() || [];
    const items = houses.map(h => {
      const active = h.house_id === houseId ? ' rail-item-active' : '';
      const img = h.image_url
        ? `<img src="${h.image_url}" alt="" onerror="this.style.display='none'">`
        : '<span class="rail-thumb-ph">🏠</span>';
      return `<button class="rail-item${active}" onclick="Router.navigate('detail','${h.house_id}')">
          <span class="rail-thumb">${img}</span>
          <span class="rail-item-name">${Utils.esc(h.door_number)}</span>
        </button>`;
    }).join('');
    return `
      <div class="house-rail">
        <div class="house-rail-tab">🏠 房屋</div>
        <div class="house-rail-panel">
          <div class="rail-list">${items}</div>
        </div>
      </div>`;
  },

  // ========== 通用：按下显示（details 折叠） ==========
  _disclosure(title, contentHtml, highlight) {
    return `
      <details class="detail-disclosure${highlight ? ' detail-disclosure-hl' : ''}">
        <summary class="detail-disclosure-summary">
          <span class="disc-icon">▸</span>${Utils.esc(title)}
        </summary>
        <div class="detail-disclosure-body">${contentHtml}</div>
      </details>
    `;
  },

  /** 照片网格（数组 → 多图）；点击放大查看（Viewer 灯箱，支持左右切换）；field 存在时显示删除/添加按钮 */
  _photoGrid(urls, field) {
    const arr = (urls || []).filter(u => u && String(u).trim());
    const items = arr.map((u, i) => `
      <div class="photo-item" data-index="${i}" onclick="Viewer.openImagesFromGrid(this)">
        <img src="${Utils.esc(u)}" alt="" onerror="this.parentNode.classList.add('photo-broken')">
        <span class="photo-broken-tip">无法预览</span>
        ${field ? `<button class="photo-del readonly-hide" title="删除此照片" onclick="event.stopPropagation();DetailPage.deleteMedia('${field}', ${i})">×</button>` : ''}
      </div>`).join('');
    const grid = arr.length ? `<div class="photo-grid" data-urls='${Utils.esc(JSON.stringify(arr))}'>${items}</div>` : '';
    const addBtn = field ? `<button class="photo-add readonly-hide" onclick="DetailPage.addMedia('${field}', true, 'image/*')">＋ 添加照片</button>` : '';
    if (arr.length === 0) return '<div class="disclosure-empty">暂无照片</div>' + addBtn;
    return grid + addBtn;
  },

  /** 平面图（支持多张；图片点击放大、PDF 点击放大可滚动）；field 存在时支持上传与删除 */
  _planBlock(urls, field) {
    const addBtn = field ? `<button class="photo-add readonly-hide" onclick="DetailPage.addMedia('${field}', true, 'image/*,application/pdf')">＋ 添加平面图</button>` : '';
    const arr = (urls || []).filter(u => u && String(u).trim());
    if (arr.length === 0) return '<div class="disclosure-empty">暂无平面图</div>' + addBtn;
    const images = arr.filter(u => !/\.pdf$/i.test(u));
    const pdfs = arr.filter(u => /\.pdf$/i.test(u));
    let html = '';
    if (images.length) {
      const items = images.map((u, i) => `
        <div class="photo-item" data-index="${i}" onclick="Viewer.openImagesFromGrid(this)">
          <img src="${Utils.esc(u)}" alt="" onerror="this.parentNode.classList.add('photo-broken')">
          <span class="photo-broken-tip">无法预览</span>
          ${field ? `<button class="photo-del readonly-hide" title="删除此平面图" onclick="event.stopPropagation();DetailPage.deleteMedia('${field}', ${arr.indexOf(u)})">×</button>` : ''}
        </div>`).join('');
      html += `<div class="photo-grid" data-urls='${Utils.esc(JSON.stringify(images))}'>${items}</div>`;
    }
    if (pdfs.length) {
      html += pdfs.map(u => {
        const name = u.split('/').pop();
        const idx = arr.indexOf(u);
        return `
        <div class="plan-file-card">
          <span class="plan-file-icon">📄</span>
          <span class="plan-file-name" title="${Utils.esc(name)}">${Utils.esc(name)}</span>
          <span class="plan-file-actions">
            ${field ? `<button class="photo-del photo-del-inline readonly-hide" title="删除此平面图" onclick="event.stopPropagation();DetailPage.deleteMedia('${field}', ${idx})">×</button>` : ''}
            <button class="btn btn-sm btn-primary" onclick="Viewer.openPdf('${Utils.esc(u)}')">查看</button>
            <a href="${Utils.esc(u)}" download class="btn btn-sm">下载</a>
          </span>
        </div>`;
      }).join('');
    }
    return html + addBtn;
  },

  _deviceBlock(house) {
    return `
      <div class="device-grid">
        <div class="info-cell"><div class="info-label">水表号</div><div class="info-value">${Utils.esc(house.water_meter) || '待补录'}</div></div>
        <div class="info-cell"><div class="info-label">电表号</div><div class="info-value">${Utils.esc(house.electric_meter) || '待补录'}</div></div>
      </div>`;
  },

  /** 当前商户的转租合同（按有效/历史分组） */
  _subContractsBlock(houseId) {
    const subs = DB.getSubContractsByHouse(houseId);
    const today = new Date().toISOString().slice(0, 10);
    const active = subs.filter(s => (!s.start_date || s.start_date <= today) && (!s.end_date || s.end_date >= today));
    const historical = subs.filter(s => !active.includes(s));
    if (active.length === 0 && historical.length === 0) return '<div class="disclosure-empty">暂无合同</div>';
    return active.map(s => this._subCard(s)).join('') +
      (historical.length ? `
        <details class="nested-disclosure">
          <summary>历史记录（${historical.length}）</summary>
          ${historical.map(s => this._subCard(s, true)).join('')}
        </details>` : '');
  },

  _subCard(s, dim) {
    return `
      <div class="contract-card${dim ? ' dim' : ''}">
        <div class="card-header">
          <div class="card-title">${Utils.esc(s.actual_tenant)}</div>
          <div>
            ${Utils.statusTag(s.payment_status_sub, PAYMENT_COLORS)}
            <button class="btn-text btn-sm readonly-hide" onclick="DetailPage.editSubContract('${s.sub_id}')">编辑</button>
            <button class="btn-text btn-sm readonly-hide" onclick="DetailPage.copySubContract('${s.sub_id}')">复制新增</button>
            <button class="btn-text btn-sm danger readonly-hide" onclick="DetailPage.endSubContract('${s.sub_id}')">终止</button>
          </div>
        </div>
        <div class="card-body">
          <div class="info-item"><div class="label">合同编号</div><div class="value">${Utils.esc(s.sub_contract_no)}</div></div>
          <div class="info-item"><div class="label">转租面积</div><div class="value">${Utils.formatArea(s.sub_lease_area)}</div></div>
          <div class="info-item"><div class="label">实收租金</div><div class="value">${Utils.formatMoney(s.received_rent)} 元/月</div></div>
          <div class="info-item"><div class="label">租约剩余</div><div class="value">${Utils.daysRemainingLabel(s.end_date)}</div></div>
          <div class="info-item"><div class="label">起租日</div><div class="value">${Utils.formatDate(s.start_date)}</div></div>
          <div class="info-item"><div class="label">到期日</div><div class="value">${Utils.formatDate(s.end_date)}</div></div>
          ${s.sub_remarks ? `<div class="info-item" style="grid-column:1/-1;"><div class="label">备注</div><div class="value">${Utils.esc(s.sub_remarks)}</div></div>` : ''}
        </div>
      </div>`;
  },

  // ========== 收储合同（板块一下拉，复用原表格渲染） ==========
  renderMasterTab(houseId) {
    const contracts = DB.getMasterContractsByHouse(houseId);
    return `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:15px;">收储合同（${contracts.length} 份）</h3>
        <button class="btn btn-sm btn-primary readonly-hide" onclick="DetailPage.addMasterContract()">+ 新增收储合同</button>
      </div>
      ${contracts.length === 0 ? `
        <div class="empty-state"><div class="icon">📋</div><div class="text">暂无收储合同</div></div>
      ` : `
        <table class="sub-table">
          <thead>
            <tr>
              <th>合同编号</th><th>产权人</th><th>合同面积(㎡)</th><th>定级</th>
              <th>应付租金(元)</th><th>我方支付</th><th>起止日期</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${contracts.map(c => `
              <tr>
                <td>${Utils.esc(c.contract_number)}</td>
                <td>${Utils.esc(c.owner_name)}</td>
                <td>${Utils.formatArea(c.contract_area)}</td>
                <td>${c.grade ? `<span class="tag tag-purple">${c.grade}</span>` : '—'}</td>
                <td>${Utils.formatMoney(c.payable_rent)}</td>
                <td>${Utils.statusTag(c.payment_status_master, PAYMENT_COLORS)}</td>
                <td style="font-size:12px;">${Utils.formatDate(c.start_date)}~${Utils.formatDate(c.end_date)}</td>
                <td>
                  <button class="btn-text btn-sm readonly-hide" onclick="DetailPage.editMasterContract('${c.contract_id}')">编辑</button>
                  <button class="btn-text btn-sm readonly-hide" onclick="DetailPage.copyMasterContract('${c.contract_id}')">复制新增</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;
  },

  // ========== 变更日志（板块一下拉，复用原表格渲染） ==========
  renderLogTab(houseId) {
    const logs = DB.getChangeLogs(houseId);
    return `
      <h3 style="font-size:15px; margin-bottom:12px;">变更日志（${logs.length} 条）</h3>
      ${logs.length === 0 ? `
        <div class="empty-state"><div class="icon">📝</div><div class="text">暂无变更记录</div></div>
      ` : `
        <table class="log-table">
          <thead>
            <tr><th>修改时间</th><th>操作人</th><th>字段名</th><th>修改前</th><th>修改后</th></tr>
          </thead>
          <tbody>
            ${logs.map(log => `
              <tr>
                <td style="white-space:nowrap;">${Utils.formatDateTime(log.timestamp)}</td>
                <td>${Utils.esc(log.operator)}</td>
                <td>${Utils.esc(log.field_label)}</td>
                <td class="log-old">${Utils.esc(log.old_value)}</td>
                <td class="log-new">${Utils.esc(log.new_value)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;
  },

  // ========== 挂载 ==========
  afterRender(houseId) {
    if (houseId) PlanSection.afterRenderLocality(houseId);
  },

  // ========== 板块三：资产管理（敏感信息：合同 / 租金 / 水电标号） ==========
  goAssetMgmt() {
    Router.navigate('asset', this.currentHouseId);
  },

  /** 资产管理页：仅在内部展示合同、租金、水电标号等敏感信息 */
  renderAssetMgmt(houseId) {
    this.currentHouseId = houseId;
    const house = DB.getHouseById(houseId);
    if (!house) {
      return '<div class="empty-state"><div class="icon">❌</div><div class="text">房屋不存在</div></div>';
    }
    const mc = DB.getMasterContractsByHouse(houseId);
    const subs = DB.getSubContractsByHouse(houseId);
    const today = new Date().toISOString().slice(0, 10);
    const active = subs.filter(s => (!s.start_date || s.start_date <= today) && (!s.end_date || s.end_date >= today));

    return `
      <div class="breadcrumb">
        <a onclick="Router.navigate('list')">资产总览</a>
        <span class="separator">/</span>
        <a onclick="Router.navigate('detail', '${houseId}')">${Utils.esc(house.door_number)}</a>
        <span class="separator">/</span>
        <span class="current">资产管理</span>
      </div>

      <div class="detail-section">
        <div class="detail-section-head">
          <h2 class="detail-section-title">资产管理 · 敏感信息</h2>
          <button class="btn btn-sm btn-primary readonly-hide" onclick="DetailPage.editMeters('${houseId}')">编辑水电标号</button>
        </div>
        <div class="asset-warn">🔒 以下含收储 / 转租合同、应付 / 实收租金、水电标号等敏感信息，请勿外传。</div>

        <h3 class="asset-h3">收储合同（${mc.length} 份）</h3>
        ${mc.length === 0 ? '<div class="disclosure-empty">暂无收储合同</div>' : `
          <div class="table-container">
            <table class="sub-table">
              <thead><tr><th>合同编号</th><th>产权人</th><th>合同面积</th><th>定级</th><th>应付租金(元)</th><th>我方支付</th><th>起止日期</th><th>操作</th></tr></thead>
              <tbody>
                ${mc.map(c => `
                  <tr>
                    <td>${Utils.esc(c.contract_number)}</td>
                    <td>${Utils.esc(c.owner_name)}</td>
                    <td>${Utils.formatArea(c.contract_area)}</td>
                    <td>${c.grade ? `<span class="tag tag-purple">${c.grade}</span>` : '—'}</td>
                    <td class="amt">${Utils.formatMoney(c.payable_rent)}</td>
                    <td>${Utils.statusTag(c.payment_status_master, PAYMENT_COLORS)}</td>
                    <td style="font-size:12px;">${Utils.formatDate(c.start_date)}~${Utils.formatDate(c.end_date)}</td>
                    <td><button class="btn-text btn-sm readonly-hide" onclick="DetailPage.editMasterContract('${c.contract_id}')">编辑</button></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`}

        <h3 class="asset-h3">转租合同（${subs.length} 份）</h3>
        <button class="btn btn-sm btn-primary asset-add readonly-hide" onclick="DetailPage.addSubContract()">＋ 新增转租合同</button>
        ${subs.length === 0 ? '<div class="disclosure-empty">暂无转租合同</div>' : active.map(s => this._subCard(s)).join('')}

        <h3 class="asset-h3">水电标号</h3>
        <div class="kv-grid">
          <div class="kv"><span class="kv-k">水表号</span><span class="kv-v">${Utils.esc(house.water_meter) || '待补录'}</span></div>
          <div class="kv"><span class="kv-k">电表号</span><span class="kv-v">${Utils.esc(house.electric_meter) || '待补录'}</span></div>
        </div>
      </div>
    `;
  },

  /** 编辑水电标号（敏感信息，仅资产管理页内） */
  editMeters(houseId) {
    const house = DB.getHouseById(houseId);
    if (!house) return;
    Drawers.open('编辑水电标号', `

  // ========== 媒体上传（手动添加照片/平面图，压缩后以 base64 存入 localStorage） ==========
  /** 触发系统文件选择框，支持多文件 */
  _pickFiles(accept, multiple, cb) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.multiple = !!multiple;
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const files = Array.prototype.slice.call(input.files || []);
      if (input.parentNode) input.parentNode.removeChild(input);
      cb(files);
    });
    input.click();
  },

  /** 图片压缩：限制最大宽度，导出 JPEG dataURL，避免 localStorage 爆量 */
  _compressImage(file, maxW = 1280, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  /** 读取文件为 dataURL（用于 PDF 等不可压缩类型） */
  _readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  /**
   * 上传并写入媒体字段
   * @param field 字段名：数组型 current_status_photos/current_status_plan/renovation_drawings/renovation_photos；单值型 image_url
   * @param multiple 是否多文件（数组字段传 true）
   * @param accept input accept
   */
  addMedia(field, multiple, accept) {
    this._pickFiles(accept, multiple, (files) => {
      if (!files.length) return;
      const house = DB.getHouseById(this.currentHouseId);
      if (!house) return;
      const fieldLabel = { current_status_photos: '房屋现状照片', current_status_plan: '房屋现状平面图', renovation_drawings: '改造图纸', renovation_photos: '改造照片', image_url: '房屋实景' }[field] || field;
      if (multiple) {
        Promise.all(files.map(f => this._compressImage(f))).then((urls) => {
          const arr = (house[field] || []).slice();
          urls.forEach(u => arr.push(u));
          try {
            DB.updateHouse(this.currentHouseId, { [field]: arr }, '详情页新增' + fieldLabel);
            Utils.toast('已添加 ' + urls.length + ' 张照片', 'success');
            Router.render();
          } catch (e) {
            Utils.toast('保存失败：本地存储空间可能已满，请先删除部分照片', 'error');
          }
        }).catch(() => Utils.toast('图片读取失败', 'error'));
      } else {
        const f = files[0];
        const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
        const done = (dataUrl) => {
          try {
            DB.updateHouse(this.currentHouseId, { [field]: dataUrl }, '详情页新增' + fieldLabel);
            Utils.toast('已上传' + (isPdf ? '平面图' : '照片'), 'success');
            Router.render();
          } catch (e) {
            Utils.toast('保存失败：本地存储空间可能已满', 'error');
          }
        };
        if (isPdf) this._readAsDataURL(f).then(done);
        else this._compressImage(f).then(done).catch(() => Utils.toast('图片读取失败', 'error'));
      }
    });
  },

    if (typeof index === 'number' && Array.isArray(house[field])) {
      const arr = house[field].slice();
      arr.splice(index, 1);
      DB.updateHouse(this.currentHouseId, { [field]: arr }, '详情页删除媒体');
    } else {
      DB.updateHouse(this.currentHouseId, { [field]: '' }, '详情页删除媒体');
    }
    Utils.toast('已删除', 'success');
    Router.render();
  },

      DB.updateMasterContract(existingId, data, '详情页编辑');
      Utils.toast('收储合同已更新', 'success');
    } else {
      DB.addMasterContract(data);
      Utils.toast('收储合同已新增', 'success');
    }
    Drawers.close();
    Router.render();
  }
};

  <script>
/* 看图灯箱 Viewer：图片支持 双指缩放 / 单指平移(放大时) / 左右滑动切换(未放大时) / 双击缩放；
   PDF 居中放大可滚动；点击空白关闭 */
(function () {
  const Viewer = {
    _overlay: null,
    _onKey: null,

    /** 打开图片灯箱；urls 为图片地址数组，index 为起始下标 */
    openImages(urls, index) {
      if (!urls || !urls.length) return;
      index = Math.max(0, Math.min(index | 0, urls.length - 1));
      this._buildOverlay('image');
      const img = this._overlay.querySelector('.viewer-img');
      const counter = this._overlay.querySelector('.viewer-counter');
      const prev = this._overlay.querySelector('.viewer-nav.prev');
      const next = this._overlay.querySelector('.viewer-nav.next');

      // 缩放/平移状态
      let scale = 1, tx = 0, ty = 0;
      const apply = () => { img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; };
      const reset = () => {
        scale = 1; tx = 0; ty = 0;
        img.style.transition = 'transform .2s ease';
        apply();
        setTimeout(() => { img.style.transition = ''; }, 220);
      };

      const render = (i) => {
        index = (i + urls.length) % urls.length;
        img.style.transition = 'none';
        img.src = urls[index];
        reset();
        counter.textContent = (index + 1) + ' / ' + urls.length;
        const show = urls.length > 1;
        prev.style.display = show ? '' : 'none';
        next.style.display = show ? '' : 'none';
      };
      render(index);

      prev.onclick = (e) => { e.stopPropagation(); render(index - 1); };
      next.onclick = (e) => { e.stopPropagation(); render(index + 1); };

      // ---- 触摸手势 ----
      let mode = null, startX = 0, startY = 0, lastX = 0, startTx = 0, startTy = 0;
      let startDist = 0, startScale = 1, moved = false;
      const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

      img.addEventListener('touchstart', (e) => {
        moved = false;
        img.style.transition = 'none';
        if (e.touches.length === 2) {
          mode = 'pinch';
          startDist = dist(e.touches[0], e.touches[1]) || 1;
          startScale = scale;
        } else if (e.touches.length === 1) {
          startX = lastX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startTx = tx; startTy = ty;
          mode = scale > 1 ? 'pan' : 'swipe';
        }
      }, { passive: false });

      img.addEventListener('touchmove', (e) => {
        if (!mode) return;
        e.preventDefault();
        if (mode === 'pinch' && e.touches.length === 2) {
          const d = dist(e.touches[0], e.touches[1]);
          scale = Math.min(6, Math.max(1, startScale * (d / startDist)));
          apply(); moved = true;
        } else if (mode === 'pan' && e.touches.length === 1) {
          const t = e.touches[0];
          tx = startTx + (t.clientX - startX);
          ty = startTy + (t.clientY - startY);
          apply(); moved = true;
        } else if (mode === 'swipe' && e.touches.length === 1) {
          lastX = e.touches[0].clientX; moved = true; // 仅记录，touchend 时判断切换
        }
      }, { passive: false });

      img.addEventListener('touchend', (e) => {
        if (mode === 'pinch') {
          // 双指松开剩单指 → 进入平移
          if (e.touches.length === 1) {
            mode = 'pan';
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            startTx = tx; startTy = ty;
          } else {
            mode = null; if (scale <= 1) reset();
          }
          return;
        }
        if (mode === 'swipe') {
          const dx = lastX - startX;
          if (Math.abs(dx) > 40) render(dx < 0 ? index + 1 : index - 1);
        }
        if (scale <= 1) mode = null;
      }, { passive: true });

      // 双击切换缩放（桌面/支持双击的设备）
      img.addEventListener('dblclick', () => {
        if (scale > 1) reset();
        else { scale = 2.5; apply(); }
      });
    },

    /** 从网格容器委托打开（读取 data-urls 与当前 data-index） */
    openImagesFromGrid(el) {
      const grid = el.closest('.photo-grid');
      if (!grid) return;
      let urls = [];
      try { urls = JSON.parse(grid.getAttribute('data-urls') || '[]'); } catch (e) { urls = []; }
      const idx = parseInt(el.getAttribute('data-index') || '0', 10) || 0;
      this.openImages(urls, idx);
    },

    /** 打开 PDF（图纸/合同）查看器：居中放大、可上下滚动，点击空白关闭 */
    openPdf(url) {
      if (!url) return;
      this._buildOverlay('pdf');
      this._overlay.querySelector('.viewer-pdf').src = url;
    },

    _buildOverlay(type) {
      this.close();
      const ov = document.createElement('div');
      ov.className = 'viewer-overlay viewer-' + type;
      if (type === 'image') {
        ov.innerHTML =
          '<div class="viewer-close" title="关闭">×</div>' +
          '<button class="viewer-nav prev" title="上一张">‹</button>' +
          '<img class="viewer-img" alt="">' +
          '<button class="viewer-nav next" title="下一张">›</button>' +
          '<div class="viewer-counter"></div>';
      } else {
        ov.innerHTML =
          '<div class="viewer-close" title="关闭">×</div>' +
          '<div class="viewer-pdf-wrap"><iframe class="viewer-pdf" frameborder="0"></iframe></div>';
      }
      // 点击空白处关闭；图片/导航/iframe 内部点击不关闭
      ov.addEventListener('click', (e) => {
        if (e.target === ov || e.target.classList.contains('viewer-close') ||
            e.target.classList.contains('viewer-pdf-wrap')) {
          this.close();
        }
      });
      this._onKey = (e) => {
        if (!this._overlay) return;
        if (e.key === 'Escape') this.close();
        else if (e.key === 'ArrowLeft') {
          const p = this._overlay.querySelector('.viewer-nav.prev');
          if (p && p.style.display !== 'none') p.click();
        } else if (e.key === 'ArrowRight') {
          const n = this._overlay.querySelector('.viewer-nav.next');
          if (n && n.style.display !== 'none') n.click();
        }
      };
      document.addEventListener('keydown', this._onKey);
      document.body.style.overflow = 'hidden';
      document.body.appendChild(ov);
      this._overlay = ov;
    },

    close() {
      if (this._overlay) {
        this._overlay.remove();
        this._overlay = null;
        document.body.style.overflow = '';
        if (this._onKey) document.removeEventListener('keydown', this._onKey);
      }
    }
  };

  window.Viewer = Viewer;
})();

</script>
  <script>
/**
 * 主应用逻辑 - 路由 + 列表页
 */

// ========== 路由 ==========
const Router = {
  currentView: 'list',
  currentHouseId: null,

  navigate(view, houseId) {
    this.currentView = view;
    this.currentHouseId = houseId || null;
    this.render();
    window.scrollTo(0, 0);
  },

  render() {
    const app = document.getElementById('app');
    if (this.currentView === 'list') {
      app.innerHTML = ListPage.render();
      ListPage.afterRender();
    } else if (this.currentView === 'detail') {
      app.innerHTML = DetailPage.render(this.currentHouseId);
      DetailPage.afterRender(this.currentHouseId);
    } else if (this.currentView === 'asset') {
      app.innerHTML = DetailPage.renderAssetMgmt(this.currentHouseId);
    }
  }
};

// ========== 列表页状态 ==========
const ListState = {
  filters: {
    leasing_status: '',
    door_number: '',
    grade: '',
    actual_tenant: ''
  },
  sort: { field: 'door_number', order: 'asc' },
  page: 1,
  pageSize: PAGE_SIZE
};

// ========== 信息一览状态（招商/资产切换 + 搜索 + 排序） ==========
const OverviewState = {
  tab: 'leasing',      // 'leasing' | 'asset'，默认优先显示招商信息管理
  search: '',
  recruitStatus: '',   // 招商情况分类筛选：'' | 招商中 | 洽谈中 | 已落户
  areaOrder: 'desc',   // 'asc' | 'desc'，按面积排序
  _searchActive: false
};

// ========== 列表页 ==========
const ListPage = {
  /**
   * 获取过滤后的房屋列表
   */
  getFilteredHouses() {
    let houses = DB.getHouses();

    const f = ListState.filters;
    if (f.leasing_status) {
      houses = houses.filter(h => h.leasing_status === f.leasing_status);
    }
    if (f.door_number) {
      houses = houses.filter(h => h.door_number.includes(f.door_number));
    }
    if (f.grade) {
      const houseIds = new Set(
        DB.getMasterContracts().filter(c => c.grade === f.grade).map(c => c.house_id)
      );
      houses = houses.filter(h => houseIds.has(h.house_id));
    }
    if (f.actual_tenant) {
      const houseIds = new Set(
        DB.getSubContracts()
          .filter(s => s.actual_tenant && s.actual_tenant.includes(f.actual_tenant))
          .map(s => s.house_id)
      );
      houses = houses.filter(h => houseIds.has(h.house_id));
    }

    // 排序
    const { field, order } = ListState.sort;
    houses.sort((a, b) => {
      let valA, valB;
      if (field === 'door_number') {
        valA = a.door_number || '';
        valB = b.door_number || '';
      } else if (field === 'measured_area') {
        valA = a.measured_area || 0;
        valB = b.measured_area || 0;
      } else if (field === 'expiry_date') {
        valA = Biz.getCurrentExpiryDate(a.house_id) || '9999-99-99';
        valB = Biz.getCurrentExpiryDate(b.house_id) || '9999-99-99';
      } else {
        valA = a[field] || '';
        valB = b[field] || '';
      }
      if (valA < valB) return order === 'asc' ? -1 : 1;
      if (valA > valB) return order === 'asc' ? 1 : -1;
      return 0;
    });

    return houses;
  },

  /**
   * 渲染列表页
   */
  render() {
    const stats = Biz.getStats();
    const totalArea = DB.getHouses().reduce((s, h) => s + (parseFloat(h.measured_area) || 0), 0);
    const leasing = OverviewState.tab === 'leasing' ? this.getLeasingHouses() : [];
    const settledCount = DB.getHouses().filter(h => (h.recruit_status || '') === '已落户').length;

    return `
      <!-- 仪表盘（位于总平面图之前） -->
      <div class="dashboard">
        <div class="dash-card dash-total">
          <div class="dash-icon">📋</div>
          <div class="dash-info">
            <div class="dash-value">${stats.total}</div>
            <div class="dash-label">租赁标的数量</div>
          </div>
        </div>
        <div class="dash-card dash-rented">
          <div class="dash-icon">🤝</div>
          <div class="dash-info">
            <div class="dash-value">${settledCount}</div>
            <div class="dash-label">招商数量（已落户）</div>
          </div>
        </div>
        <div class="dash-card dash-area">
          <div class="dash-icon">📐</div>
          <div class="dash-info">
            <div class="dash-value">${Utils.formatArea(totalArea)}</div>
            <div class="dash-label">总面积</div>
          </div>
        </div>
      </div>

      <!-- 总平面图（点击色块跳转详情） -->
      ${PlanSection.render(PlanSection._focusId || null)}

      <!-- 信息一览 -->
      <div class="overview-section">
        <div class="overview-header">
          <div class="overview-title">信息一览</div>
          <div class="overview-tabs">
            <button class="tab-btn ${OverviewState.tab === 'leasing' ? 'active' : ''}" onclick="ListPage.switchTab('leasing')">招商信息管理</button>
            <button class="tab-btn ${OverviewState.tab === 'asset' ? 'active' : ''}" onclick="ListPage.switchTab('asset')">资产管理</button>
          </div>
        </div>

        ${OverviewState.tab === 'leasing' ? `
          <div class="leasing-toolbar">
            <input type="text" id="overview-search" class="overview-search"
                   placeholder="搜索 招商情况 / 房屋地址"
                   value="${Utils.esc(OverviewState.search)}"
                   onfocus="OverviewState._searchActive=true"
                   onblur="OverviewState._searchActive=false"
                   oninput="ListPage.onOverviewSearch(this.value)">
            <select id="overview-recruit" class="overview-select" onchange="ListPage.onRecruitFilter(this.value)">
              <option value="">招商情况：全部</option>
              ${RECRUIT_STATUS.map(s => `<option value="${s}" ${OverviewState.recruitStatus === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
            <span class="leasing-count">共 ${leasing.length} 条</span>
          </div>
          <div class="table-container">
            <table class="data-table leasing-table">
              <thead>
                <tr>
                  <th>房屋图片</th>
                  <th>地址</th>
                  <th class="sortable ${OverviewState.areaOrder ? 'sorted' : ''}" onclick="ListPage.toggleAreaSort()">面积 <span class="sort-icon">${OverviewState.areaOrder === 'asc' ? '▲' : '▼'}</span></th>
                  <th>招商情况</th>
                  <th>需修缮周期</th>
                  <th>当前经营户</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${leasing.length === 0 ? `
                  <tr><td colspan="7">
                    <div class="empty-state">
                      <div class="icon">🔍</div>
                      <div class="text">没有符合条件的房屋记录</div>
                    </div>
                  </td></tr>
                ` :                 leasing.map(h => {
                  const tenantName = Biz.getTenantName(h.house_id) || '—';
                  const imgUrl = h.image_url || '';
                  return `
                    <tr class="${h.is_dangerous ? 'danger-row' : ''}">
                      <td class="col-img" data-label="房屋图片">
                        <div class="house-thumb">
                          ${imgUrl ? `<img src="${Utils.esc(imgUrl)}" alt="" onerror="this.style.display='none'">` : ''}
                          <span class="thumb-ph">🏠</span>
                        </div>
                      </td>
                      <td class="col-addr" data-label="地址"><span class="door-link" onclick="Router.navigate('detail', '${h.house_id}')">${Utils.esc(h.door_number)}</span>${h.is_dangerous ? '<span class="danger-badge">⚠危房</span>' : ''}</td>
                      <td data-label="面积">${Utils.formatArea(h.measured_area)}</td>
                      <td data-label="招商情况">${Utils.statusTag(h.recruit_status, RECRUIT_COLORS)}</td>
                      <td data-label="需修缮周期">${Utils.statusTag(h.repair_cycle, REPAIR_COLORS)}</td>
                      <td data-label="当前经营户">${Utils.esc(tenantName)}</td>
                      <td class="col-ops" data-label="操作">
                        <button class="btn-text btn-sm" onclick="Router.navigate('detail', '${h.house_id}')">查看</button>
                        <button class="btn-text btn-sm" title="在平面图上定位" onclick="event.stopPropagation(); PlanSection.focusHouse('${h.house_id}')">📍定位</button>
                        <button class="btn-text btn-sm readonly-hide" onclick="Drawers.openQuickEdit('${h.house_id}')">编辑</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        ` : `
          <div class="asset-placeholder">
            <div class="icon">🏗️</div>
            <div class="text">资产管理模块正在设计开发中</div>
            <div class="hint">后期将在此展示资产台账、折旧、修缮维护等详细管理功能</div>
          </div>
        `}
      </div>
    `;
  },

  /** 获取招商管理列表（招商情况分类 + 搜索招商情况/房屋地址 + 按面积排序） */
  getLeasingHouses() {
    let houses = DB.getHouses();
    // 招商情况分类筛选
    if (OverviewState.recruitStatus) {
      houses = houses.filter(h => (h.recruit_status || '') === OverviewState.recruitStatus);
    }
    // 关键字搜索：招商情况 + 房屋地址
    const q = (OverviewState.search || '').trim().toLowerCase();
    if (q) {
      houses = houses.filter(h =>
        (h.recruit_status || '').toLowerCase().includes(q) ||
        (h.door_number || '').toLowerCase().includes(q)
      );
    }
    const dir = OverviewState.areaOrder === 'asc' ? 1 : -1;
    houses.sort((a, b) => ((a.measured_area || 0) - (b.measured_area || 0)) * dir);
    return houses;
  },

  switchTab(tab) {
    OverviewState.tab = tab;
    Router.render();
  },

  onOverviewSearch(val) {
    OverviewState.search = val;
    Router.render();
  },

  onRecruitFilter(val) {
    OverviewState.recruitStatus = val;
    Router.render();
  },

  toggleAreaSort() {
    OverviewState.areaOrder = OverviewState.areaOrder === 'asc' ? 'desc' : 'asc';
    Router.render();
  },

  renderPageButtons(totalPages) {
    let buttons = [];
    const current = ListState.page;
    let start = Math.max(1, current - 2);
    let end = Math.min(totalPages, current + 2);
    if (start > 1) buttons.push('<span>...</span>');
    for (let i = start; i <= end; i++) {
      buttons.push(`<button onclick="ListPage.goPage(${i})" class="${i === current ? 'active' : ''}">${i}</button>`);
    }
    if (end < totalPages) buttons.push('<span>...</span>');
    return buttons.join('');
  },

  afterRender() {
    PlanSection.afterRender();
    // 搜索框在重新渲染后保持焦点，保证连续输入不丢焦
    if (OverviewState._searchActive) {
      const si = document.getElementById('overview-search');
      if (si) { si.focus(); const v = si.value; si.value = ''; si.value = v; }
    }
  },

  onFilterChange(key, value) {
    ListState.filters[key] = value;
    ListState.page = 1;
    Router.render();
  },

  toggleSort(field) {
    if (ListState.sort.field === field) {
      ListState.sort.order = ListState.sort.order === 'asc' ? 'desc' : 'asc';
    } else {
      ListState.sort.field = field;
      ListState.sort.order = 'asc';
    }
    Router.render();
  },

  goPage(page) {
    ListState.page = page;
    Router.render();
  },

  resetFilters() {
    ListState.filters = {
      leasing_status: '', door_number: '', grade: '', actual_tenant: ''
    };
    ListState.page = 1;
    Router.render();
  },

  filterByStatus(status) {
    ListState.filters.leasing_status = status;
    ListState.page = 1;
    Router.render();
  }
};

// ========== 操作（导入/导出/重置） ==========

/**
 * 导入列定义（与 Excel 模板表头一一对应）。
 * label: 模板表头中文；field: 写入房屋的字段；type: 'num'|'bool'|'text'
 */
const IMPORT_COLUMNS = [
  { label: '门牌号', field: 'door_number', type: 'text', key: true },
  { label: '规划区域', field: 'planning_area', type: 'text' },
  { label: '实测面积(㎡)', field: 'measured_area', type: 'num' },
  { label: '招商状态', field: 'leasing_status', type: 'text' },
  { label: '招商情况', field: 'recruit_status', type: 'text' },
  { label: '层数', field: 'floors', type: 'text' },
  { label: '格局', field: 'layout', type: 'text' },
  { label: '房屋现状', field: 'current_status', type: 'text' },
  { label: '水表号', field: 'water_meter', type: 'text' },
  { label: '电表号', field: 'electric_meter', type: 'text' },
  { label: '经营户', field: 'manual_tenant_name', type: 'text' },
  { label: '危房', field: 'is_dangerous', type: 'bool' }
];

/** 将 Excel 一行（按表头中文取值）转为房屋字段对象，跳过空值 */
function rowToFields(row) {
  const out = {};
  IMPORT_COLUMNS.forEach(c => {
    if (c.key) return;
    let v = row[c.label];
    if (v === undefined || v === null) v = '';
    v = String(v).trim();
    if (v === '') return;
    if (c.type === 'num') {
      const n = parseFloat(v);
      if (isNaN(n)) return;
      out[c.field] = n;
    } else if (c.type === 'bool') {
      out[c.field] = (v === '是' || v === '1' || v === 'true' || v === 'TRUE');
    } else {
      out[c.field] = v;
    }
  });
  return out;
}

/**
 * 生成自包含的「在线查看版」HTML（只读）。
 * 把当前 localStorage 完整数据内联进单文件，剔除 Excel 组件与所有编辑 UI。
 * 返回 Promise<string>（完整 HTML 文本），供「下载单文件」与「打包仓库 ZIP」复用。
 */
async function buildViewerHtml() {
  if (READONLY) throw new Error('当前为查看版，无法再次发布');
  const jsPaths = ['js/imported_media.js', 'js/data.js', 'js/config.js', 'js/utils.js',
    'js/plan.js', 'js/modals.js', 'js/detail.js', 'js/viewer.js', 'js/app.js'];
  const read = async (p) => {
    const r = await fetch(p, { cache: 'no-store' });
    if (!r.ok) throw new Error('读取失败: ' + p + ' (' + r.status + ')');
    return await r.text();
  };
  let html = await read('index.html');
  const css = await read('css/styles.css');
  const jsMap = {};
  for (const p of jsPaths) jsMap[p] = await read(p);
  // 内联 CSS
  html = html.replace('<link rel="stylesheet" href="css/styles.css">', '<style>\n' + css + '\n</style>');
  // 内联 JS（剔除 xlsx Excel 组件，其余按路径内联）
  html = html.replace(/<script src="([^"]+)"><\/script>/g, (m, p) => {
    if (p.indexOf('xlsx') !== -1) return '';
    return '<script>\n' + (jsMap[p] || '') + '\n</scr' + 'ipt>';
  });
  // 注入只读数据与 body 标记
  const dbData = {
    houses: DB.houses,
    masterContracts: DB.masterContracts,
    subContracts: DB.subContracts,
    changeLogs: DB.changeLogs,
    planPositions: (typeof PlanSection !== 'undefined' && PlanSection.exportPositions) ? PlanSection.exportPositions() : {}
  };
  const dataJson = JSON.stringify(dbData).replace(/</g, '\\u003c');
  html = html.replace('<body>', '<body class="readonly">')
    .replace('</head>', '<scr' + 'ipt>window.PUBLISHED_DATA = ' + dataJson + ';</scr' + 'ipt>\n</head>');
  return html;
}

  /** 一键将当前数据生成只读查看页并直接推送到 GitHub Pages 仓库（无需本地服务中转）。
   *  GitHub Token 仅存于本机浏览器 localStorage，绝不写入任何文件或发布页。 */
  async publishOnline() {
    if (READONLY) { Utils.toast('当前为查看版，无法再次发布', 'error'); return; }
    Utils.toast('正在生成并上传…', 'info');

    // Token 仅取自本机浏览器 localStorage，不在代码/发布页中硬编码
    let token = localStorage.getItem('tq_gh_pat');
    if (!token) {
      token = window.prompt(
        '请输入 GitHub 个人访问令牌(PAT)用于一键发布。\n' +
        '令牌仅保存在本机浏览器，不会写入文件或发布页。\n' +
        '（需要仓库 sakurasoupoi-blip/tianqian-hongzhuan-gucuo 的 repo 权限）', ''
      );
      if (!token) { Utils.toast('未提供令牌，已取消发布', 'error'); return; }
      token = token.trim();
      if (!token) { Utils.toast('未提供令牌，已取消发布', 'error'); return; }
      localStorage.setItem('tq_gh_pat', token);
    }

    const OWNER = 'sakurasoupoi-blip';
    const REPO = 'tianqian-hongzhuan-gucuo';

    // UTF-8 安全的 base64 编码（btoa 不能直接处理中文）
    const utf8ToBase64 = (str) => {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    };

    const api = (method, path, body) => fetch('https://api.github.com' + path, {
      method,
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'User-Agent': 'tianqian-demo',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });

    try {
      const html = await buildViewerHtml();
      const content = utf8ToBase64(html);

      // 取当前文件 sha（存在则更新，不存在则新建）
      const cur = await api('GET', `/repos/${OWNER}/${REPO}/contents/index.html?ref=main`);
      let sha;
      if (cur.ok) { const j = await cur.json(); sha = j.sha; }

      const putBody = { message: '更新 ' + new Date().toISOString(), content };
      if (sha) putBody.sha = sha;

      const res = await api('PUT', `/repos/${OWNER}/${REPO}/contents/index.html`, putBody);
      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try { const e = await res.json(); if (e && e.message) msg = e.message; } catch (_) {}
        throw new Error(msg);
      }
      const rj = await res.json();
      const cs = (rj.commit && rj.commit.sha) ? rj.commit.sha.slice(0, 10) : '';
      Utils.toast('✅ 已发布到在线（提交 ' + cs + '），硬刷新固定链接即可查看', 'success', 8000);
    } catch (err) {
      Utils.toast('发布失败：' + err.message + '（令牌无效或网络异常时请重试；可在浏览器控制台清除 tq_gh_pat 重新输入）', 'error', 9000);
    }
  },

  handleImportFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      let rows;
      try {
        if (typeof XLSX === 'undefined') throw new Error('Excel 组件未加载');
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
      } catch (err) {
        Utils.toast('Excel 解析失败：' + err.message, 'error');
        return;
      }
      if (!rows || rows.length === 0) {
        Utils.toast('文件为空或格式不正确', 'error');
        return;
      }
      // 校验
      const errors = [];
      const valid = [];
      rows.forEach((row, idx) => {
        if (!row['门牌号'] || !row['门牌号'].trim()) {
          errors.push({ row: idx + 2, message: '门牌号为空', data: row });
          return;
        }
        valid.push(row);
      });
      this.importData = { rows: valid, errors };
      // 渲染预览
      const container = document.getElementById('import-preview-container');
      if (valid.length === 0 && errors.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="text">无有效数据</div></div>';
        return;
      }
      const headers = Object.keys(rows[0] || {});
      container.innerHTML = `
        <div style="margin-top:12px; font-size:13px;">
          <span style="color:var(--success)">✓ 有效 ${valid.length} 条</span>
          ${errors.length > 0 ? `<span style="color:var(--danger); margin-left:16px;">✗ 错误 ${errors.length} 条</span>` : ''}
        </div>
        <div class="import-preview">
          <table>
            <thead><tr>${headers.map(h => `<th>${Utils.esc(h)}</th>`).join('')}<th>状态</th></tr></thead>
            <tbody>
              ${rows.map((row, idx) => {
                const isError = !row['门牌号'] || !row['门牌号'].trim();
                return `<tr class="${isError ? 'error-row' : 'ok-row'}">
                  ${headers.map(h => `<td>${Utils.esc(row[h])}</td>`).join('')}
                  <td>${isError ? '❌ 门牌号为空' : '✓ 正常'}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
      document.getElementById('import-confirm-btn').disabled = valid.length === 0;
    };
    reader.readAsArrayBuffer(file);
  },

  executeImport() {
    if (!this.importData || this.importData.rows.length === 0) return;
    const mode = document.getElementById('import-mode').value;
    let updated = 0, created = 0, skipped = 0;

    this.importData.rows.forEach(row => {
      const door = (row['门牌号'] || '').trim();
      if (!door) return;
      const fields = rowToFields(row);
      const house = DB.getHouseByDoor(door);

      if (house) {
        if (mode === 'create') { skipped++; return; }
        DB.updateHouse(house.house_id, fields, '批量导入');
        updated++;
      } else {
        DB.addHouse(Object.assign({ door_number: door }, fields));
        created++;
      }
    });

    Modals.close();
    Utils.toast(`导入完成：新增 ${created} 条，更新 ${updated} 条，跳过 ${skipped} 条`, 'success');
    Router.render();
  },

  /**

   */
  async backupDB() {
    const payload = DB.exportDB();
    const json = JSON.stringify(payload, null, 2);
    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const fname = `田墘村台账_${stamp}.json`;
    try {
      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName: fname,
          types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }]
        });
        const w = await handle.createWritable();
        await w.write(json);
        await w.close();
        Utils.toast('数据库已备份：请将其保存进项目文件夹以便迁移', 'success');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // 用户取消保存
    }
    // 退化方案：浏览器下载
    Utils.downloadFile(fname, json, 'application/json');
    Utils.toast('已下载数据库 JSON，请将其放入项目文件夹以便迁移', 'success');
  },

  restoreDB() {

      inp.accept = 'application/json,.json';
      inp.style.display = 'none';
      inp.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (f) this._doRestoreDB(f);
      });
      document.body.appendChild(inp);
    }
    inp.click();
  },

  async _doRestoreDB(file) {
    let payload;
    try {
      payload = JSON.parse(await file.text());
    } catch (err) {
      Utils.toast('恢复失败：文件不是合法 JSON', 'error');
      return;
    }
    if (payload._type !== 'tq_house_ledger_backup' || !payload.data || !Array.isArray(payload.data.houses)) {
      Utils.toast('恢复失败：不是有效的台账备份文件', 'error');
      return;
    }
    const count = payload.data.houses.length;
    if (!Utils.confirm(`确定用该备份恢复数据库吗？\n将覆盖当前全部数据（${count} 栋房屋、含照片与合同）。此操作不可撤销。`)) return;
    try {
      DB.importDB(payload);
      Utils.toast(`数据库已恢复（${count} 栋房屋）`, 'success');
      Router.navigate('list');
    } catch (err) {
      Utils.toast('恢复失败：' + err.message, 'error');
    }
  },

  resetData() {
    if (Utils.confirm('确定要重置为示例数据吗？所有手动修改将丢失！')) {
      DB.reset();
      Utils.toast('数据已重置', 'success');
      Router.navigate('list');
    }
  }
};

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  if (READONLY) document.body.classList.add('readonly');
  DB.init();
  initBackToTop();
  Router.navigate('list');
});

// ========== 返回顶部按钮 ==========
function initBackToTop() {
  const btn = document.getElementById('back-to-top');
  if (!btn) return;
  const THRESHOLD = 400; // 滚动超过该距离才出现，避免干扰正常浏览
  const onScroll = () => {
    if (window.scrollY > THRESHOLD) btn.classList.add('show');
    else btn.classList.remove('show');
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

</script>
